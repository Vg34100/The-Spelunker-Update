import java.util.Properties

plugins {
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
    id 'dev.architectury.loom' version '1.7.414' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT' apply false
}

def matrixFile = rootProject.file("gradle/matrix/${project.name}.properties")
if (!matrixFile.isFile()) {
    throw new GradleException("Missing matrix properties for ${project.path}: ${matrixFile}")
}

def matrix = new Properties()
matrixFile.withInputStream { matrix.load(it) }
def matrixValue = { String key ->
    def value = matrix.getProperty(key)
    if (value == null) throw new GradleException("Missing '${key}' in ${matrixFile}")
    value
}

def loader = matrixValue('loader')
def minecraftVersion = matrixValue('minecraft_version')
def javaVersion = matrix.getProperty('java_version', '25') as int
def legacy = matrix.getProperty('loom_generation', 'current') == 'legacy'
def isFabric = loader == 'fabric'
def isNeoForge = loader == 'neoforge'
if (!isFabric && !isNeoForge) throw new GradleException("Unsupported loader '${loader}'")

group = rootProject.maven_group
version = rootProject.mod_version

def externalBuildRoot = System.getenv('SPELUNKERY_BUILD_ROOT')
if (externalBuildRoot) {
    layout.buildDirectory.set(file("${externalBuildRoot}/${project.name}"))
}

apply plugin: legacy ? 'dev.architectury.loom' : 'dev.architectury.loom-no-remap'
if (!legacy) apply plugin: 'architectury-plugin'

base {
    archivesName = "${rootProject.archives_name}-${loader}-${minecraftVersion}"
}

repositories {
    maven { url 'https://maven.blamejared.com/' }
    maven { url 'https://maven.neoforged.net/releases/' }
}

if (!legacy) {
    architectury {
        minecraft = minecraftVersion
        platformSetupLoomIde()
        if (isFabric) fabric() else neoForge()
    }
}

if (legacy) {
    loom { silentMojangMappingsLicense() }
}

if (isNeoForge) {
    loom { neoForge { } }
    configurations {
        common {
            canBeResolved = true
            canBeConsumed = false
        }
        compileClasspath.extendsFrom common
        runtimeClasspath.extendsFrom common
        developmentNeoForge.extendsFrom common
    }
}

loom {
    if (!legacy) {
        accessWidenerPath = rootProject.file('common/src/main/resources/spelunkery.accesswidener')
    }
    runs {
        configureEach {
            runDir = rootProject.file("runs/${project.name}/${name}")
        }
    }
}

sourceSets {
    main {
        if (legacy || minecraftVersion == '26.2') {
            java.setSrcDirs([
                    layout.buildDirectory.dir('matrix-sources/common').get().asFile,
                    layout.buildDirectory.dir("matrix-sources/${loader}").get().asFile
            ])
        } else if (isNeoForge && (minecraftVersion == '26.1' || minecraftVersion == '26.1.1')) {
            java.setSrcDirs([
                    rootProject.file('common/src/main/java'),
                    layout.buildDirectory.dir('matrix-sources/neoforge').get().asFile
            ])
        } else {
            java.setSrcDirs([
                    rootProject.file('common/src/main/java'),
                    rootProject.file("${loader}/src/main/java")
            ])
        }
        resources.setSrcDirs(legacy ? [
                layout.buildDirectory.dir('matrix-resources/common').get().asFile,
                layout.buildDirectory.dir("matrix-resources/${loader}").get().asFile
        ] : [
                rootProject.file('common/src/main/resources'),
                rootProject.file("${loader}/src/main/resources")
        ])
    }
}

if (legacy) {
    ['common', loader].each { sourceName ->
        tasks.register("prepare${sourceName.capitalize()}LegacyResources", Sync) {
            from rootProject.file("${sourceName}/src/main/resources")
            def compatibilityResources = rootProject.file("gradle/compat/legacy/${sourceName}/src/main/resources")
            if (compatibilityResources.isDirectory()) inputs.dir compatibilityResources
            into layout.buildDirectory.dir("matrix-resources/${sourceName}")
            filteringCharset = 'UTF-8'
            doLast {
                def resourceRoot = destinationDir
                copy {
                    from rootProject.file("gradle/compat/legacy/${sourceName}/src/main/resources")
                    into resourceRoot
                }
                project.delete(new File(resourceRoot, 'assets/spelunkery/items'))
                project.delete(new File(resourceRoot, 'assets/spelunkery/equipment'))
                project.delete(new File(resourceRoot, 'spelunkery.accesswidener'))

                fileTree(resourceRoot).matching {
                    include 'data/**/recipe/**/*.json'
                    include 'data/**/recipes/**/*.json'
                }.files.each { recipeFile ->
                    def ingredientForLegacy = { value ->
                        value.startsWith('#') ? [tag: value.substring(1)] : [item: value]
                    }
                    def recipe = new groovy.json.JsonSlurper().parse(recipeFile)
                    if (recipe instanceof Map) {
                        def ingredientFields = ['ingredient', 'template', 'base', 'addition'] as Set
                        def rewriteIngredients
                        rewriteIngredients = { value ->
                            if (value instanceof Map) {
                                value.each { key, nested ->
                                    if (ingredientFields.contains(key) && nested instanceof String) {
                                        value[key] = ingredientForLegacy(nested)
                                    } else if (key == 'ingredients' && nested instanceof List) {
                                        value[key] = nested.collect { entry ->
                                            entry instanceof String ? ingredientForLegacy(entry) : rewriteIngredients(entry)
                                        }
                                    } else if (key == 'key' && nested instanceof Map) {
                                        nested.each { symbol, entry ->
                                            if (entry instanceof String) nested[symbol] = ingredientForLegacy(entry)
                                            else rewriteIngredients(entry)
                                        }
                                    } else {
                                        rewriteIngredients(nested)
                                    }
                                }
                            } else if (value instanceof List) {
                                value.each { rewriteIngredients(it) }
                            }
                        }
                        rewriteIngredients(recipe)
                        recipeFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(recipe)) + '\n', 'UTF-8')
                    }
                }

                fileTree(resourceRoot).matching { include '**/*.mixins.json' }.files.each { mixinFile ->
                    mixinFile.setText(mixinFile.getText('UTF-8').replace('"JAVA_25"', '"JAVA_21"'), 'UTF-8')
                }
            }
        }
    }

    ['common', loader].each { sourceName ->
        tasks.register("prepare${sourceName.capitalize()}LegacySources", Sync) {
            from rootProject.file("${sourceName}/src/main/java")
            def compatibilitySources = rootProject.file("gradle/compat/legacy/${sourceName}/src/main/java")
            if (compatibilitySources.isDirectory()) inputs.dir compatibilitySources
            into layout.buildDirectory.dir("matrix-sources/${sourceName}")
            filteringCharset = 'UTF-8'
            doLast {
                copy {
                    from rootProject.file("gradle/compat/legacy/${sourceName}/src/main/java")
                    into destinationDir
                }
                def replacements = [
                        'net.minecraft.resources.Identifier': 'net.minecraft.resources.ResourceLocation',
                        'Identifier.fromNamespaceAndPath': 'ResourceLocation.fromNamespaceAndPath',
                        'Identifier': 'ResourceLocation',
                        '.identifier()': '.location()',
                        '.isClientSide()': '.isClientSide',
                        '.noCollision()': '.noCollission()'
                ]
                fileTree(destinationDir).matching { include '**/*.java' }.files.each { sourceFile ->
                    def source = sourceFile.getText('UTF-8')
                    replacements.each { from, to -> source = source.replace(from, to) }
                    source = source.replaceAll(/\.setId\(blockKey\("[^"]+"\)\)/, '')
                    source = source.replaceAll(/\.setId\(itemKey\("[^"]+"\)\)/, '')
                    source = source.replace('.setId(itemKey(name))', '')
                    if (sourceFile.name == 'SpelunkeryNeoForge.java' || sourceFile.name == 'SpelunkeryNeoForgeClient.java') {
                        source = source.replace(
                                '@EventBusSubscriber(modid = Spelunkery.MOD_ID)',
                                '@EventBusSubscriber(modid = Spelunkery.MOD_ID, bus = EventBusSubscriber.Bus.MOD)'
                        )
                        source = source.replace(
                                'import net.neoforged.neoforge.event.level.block.BreakBlockEvent;',
                                'import net.neoforged.neoforge.event.level.BlockEvent;'
                        ).replace('BreakBlockEvent event', 'BlockEvent.BreakEvent event')
                    }
                    if (sourceFile.name == 'TonicItem.java') {
                        source = source.replace('import net.minecraft.world.item.Item;', 'import net.minecraft.world.item.Item;\nimport net.minecraft.world.item.PotionItem;')
                                .replace('public final class TonicItem extends Item {', 'public final class TonicItem extends PotionItem {')
                    }
                    if (sourceFile.name == 'SpelunkeryFabric.java') {
                        source = source.replace('import net.minecraft.world.item.CreativeModeTabs;', '''import net.minecraft.world.item.CreativeModeTabs;
import net.minecraft.world.item.Items;
import net.minecraft.world.item.crafting.Ingredient;''')
                        source = source.replace('registerVanillaCreativeTabs();', '''registerVanillaCreativeTabs();
        ThickPotionBrewingRegistry.register(Ingredient.of(SpelunkeryItems.TOPAZ_SHARD.get()), SpelunkeryItems.SPELUNKERS_BREW.get());
        ThickPotionBrewingRegistry.register(Ingredient.of(SpelunkeryItems.BAT_WING.get()), SpelunkeryItems.DANGERSENSE_TONIC.get());
        ThickPotionBrewingRegistry.register(Ingredient.of(Items.IRON_INGOT), SpelunkeryItems.MINERS_TONIC.get());''')
                    }
                    if (sourceFile.name == 'ArmorUpgradeSmithingExtension.java') {
                        source = source.replace('import java.util.List;', 'import java.util.Arrays;\nimport java.util.List;')
                                .replace('recipe.base().items()\n                .map(holder -> ArmorUpgradeHelper.applyUpgrade(new ItemStack(holder.value()), recipe.upgrade()))', 'Arrays.stream(recipe.base().getItems())\n                .map(stack -> ArmorUpgradeHelper.applyUpgrade(stack.copy(), recipe.upgrade()))')
                    }
                    if (sourceFile.name == 'FoundryCategory.java') {
                        source = source.replace('import java.util.List;', 'import java.util.Arrays;\nimport java.util.List;')
                                .replace('fi.ingredient().items()\n                    .map(holder -> { ItemStack s = new ItemStack(holder); s.setCount(fi.count()); return s; })', 'Arrays.stream(fi.ingredient().getItems())\n                    .map(stack -> { ItemStack s = stack.copy(); s.setCount(fi.count()); return s; })')
                                .replace('.addItemStack(recipe.result().create());', '.addItemStack(recipe.result().copy());')
                        if (minecraftVersion == '1.21') {
                            source = source.replace('import mezz.jei.api.recipe.IFocusGroup;', 'import mezz.jei.api.recipe.IFocusGroup;\nimport mezz.jei.api.recipe.RecipeIngredientRole;')
                                    .replace('private final IDrawable icon;', 'private final IDrawable icon;\n    private final IDrawable background;')
                                    .replace('this.icon = guiHelper.createDrawableItemStack', 'this.background = guiHelper.createBlankDrawable(WIDTH, HEIGHT);\n        this.icon = guiHelper.createDrawableItemStack')
                                    .replace('@Override public Component getTitle()', '@Override public IDrawable getBackground() { return background; }\n    @Override public Component getTitle()')
                                    .replace('builder.addInputSlot(', 'builder.addSlot(RecipeIngredientRole.INPUT, ')
                                    .replace('builder.addOutputSlot(', 'builder.addSlot(RecipeIngredientRole.OUTPUT, ')
                                    .replace('                    .setStandardSlotBackground()\n', '')
                                    .replace('                .setOutputSlotBackground()\n', '')
                                    .replace('        builder.addRecipeArrow().setPosition(ARROW_X, ARROW_Y);', '')
                        }
                    }
                    if (sourceFile.name == 'ArmorUpgradeSmithingExtension.java' && minecraftVersion == '1.21') {
                        source = source.replace('    @Override\n    public <T extends IIngredientAcceptor<T>> void setOutput', '    public <T extends IIngredientAcceptor<T>> void setOutput')
                    }
                    if (sourceFile.name == 'SpelunkeryFabric.java' && minecraftVersion == '1.21') {
                        source = source.replace('ServerLivingEntityEvents.AFTER_DAMAGE.register((entity, source, baseDamageTaken, damageTaken, blocked) -> {\n            if (!blocked) {\n                return;\n            }', 'ServerLivingEntityEvents.ALLOW_DAMAGE.register((entity, source, amount) -> {\n            if (!entity.isBlocking()) {\n                return true;\n            }')
                                .replace('                BronzeShieldItem.tryBash(entity, attacker);\n            }\n        });', '                BronzeShieldItem.tryBash(entity, attacker);\n            }\n            return true;\n        });')
                    }
                    sourceFile.setText(source, 'UTF-8')
                }
            }
        }
    }
    tasks.named('compileJava') {
        dependsOn tasks.named('prepareCommonLegacySources')
        dependsOn tasks.named("prepare${loader.capitalize()}LegacySources")
    }
    tasks.named('processResources') {
        dependsOn tasks.named('prepareCommonLegacyResources')
        dependsOn tasks.named("prepare${loader.capitalize()}LegacyResources")
    }
}

if (isNeoForge && (minecraftVersion == '26.1' || minecraftVersion == '26.1.1')) {
    tasks.register('prepareEarlyNeoForgeSources', Sync) {
        from rootProject.file('neoforge/src/main/java')
        into layout.buildDirectory.dir('matrix-sources/neoforge')
        filteringCharset = 'UTF-8'
        filter { line ->
            line.replace(
                    'import net.neoforged.neoforge.event.level.block.BreakBlockEvent;',
                    'import net.neoforged.neoforge.event.level.BlockEvent;'
            ).replace('BreakBlockEvent event', 'BlockEvent.BreakEvent event')
        }
    }
    tasks.named('compileJava') {
        dependsOn tasks.named('prepareEarlyNeoForgeSources')
    }
}

if (minecraftVersion == '26.2') {
    def replacements26_2 = [
            'net.minecraft.world.level.block.state.properties.DripstoneThickness': 'net.minecraft.world.level.block.state.properties.SpeleothemThickness',
            'DripstoneThickness': 'SpeleothemThickness',
            'net.minecraft.advancements.CriteriaTriggers': 'net.minecraft.advancements.triggers.CriteriaTriggers',
            'foundry.getBlockPos().getCenter()': 'net.minecraft.world.phys.Vec3.atCenterOf(foundry.getBlockPos())',
            'livingAttacker.knockback(BASH_STRENGTH, xKnockback, zKnockback);': 'livingAttacker.knockback(BASH_STRENGTH, xKnockback, zKnockback, blocker.damageSources().mobAttack(blocker), 0.0F);'
    ]
    ['common', loader].each { sourceName ->
        tasks.register("prepare${sourceName.capitalize()}26_2Sources", Sync) {
            from rootProject.file("${sourceName}/src/main/java")
            into layout.buildDirectory.dir("matrix-sources/${sourceName}")
            filteringCharset = 'UTF-8'
            inputs.property('compatibilityReplacements', replacements26_2)
            filter { line ->
                replacements26_2.inject(line) { adjusted, from, to -> adjusted.replace(from, to) }
            }
            doLast {
                if (sourceName == 'common') {
                    def pointed = new File(destinationDir, 'net/vg/spelunkery/block/SpelunkeryPointedDripstoneBlock.java')
                    pointed.setText(pointed.getText('UTF-8').replace(
                            'super(properties);',
                            'super(net.minecraft.world.level.block.Blocks.DRIPSTONE_BLOCK.defaultBlockState(), properties);'
                    ), 'UTF-8')
                }
            }
        }
    }
    tasks.named('compileJava') {
        dependsOn tasks.named('prepareCommon26_2Sources')
        dependsOn tasks.named("prepare${loader.capitalize()}26_2Sources")
    }
}

dependencies {
    minecraft "net.minecraft:minecraft:${minecraftVersion}"
    if (legacy) mappings loom.officialMojangMappings()

    if (isFabric) {
        def fabricDependency = legacy ? { notation -> modImplementation notation } : { notation -> implementation notation }
        fabricDependency("net.fabricmc:fabric-loader:${matrixValue('fabric_loader_version')}")
        fabricDependency("net.fabricmc.fabric-api:fabric-api:${matrixValue('fabric_api_version')}")
        fabricDependency("dev.architectury:architectury-fabric:${matrixValue('architectury_api_version')}")
        if (legacy) {
            modCompileOnly "mezz.jei:jei-${minecraftVersion}-common-api:${matrixValue('jei_version')}"
            modCompileOnly "mezz.jei:jei-${minecraftVersion}-fabric-api:${matrixValue('jei_version')}"
            modLocalRuntime "mezz.jei:jei-${minecraftVersion}-fabric:${matrixValue('jei_version')}"
        } else {
            compileOnly "mezz.jei:jei-${minecraftVersion}-common-api:${matrixValue('jei_version')}"
            compileOnly "mezz.jei:jei-${minecraftVersion}-fabric-api:${matrixValue('jei_version')}"
            runtimeOnly "mezz.jei:jei-${minecraftVersion}-fabric:${matrixValue('jei_version')}"
        }
    } else {
        neoForge "net.neoforged:neoforge:${matrixValue('neoforge_version')}"
        implementation "dev.architectury:architectury-neoforge:${matrixValue('architectury_api_version')}"
        if (legacy) {
            modCompileOnly "mezz.jei:jei-${minecraftVersion}-common-api:${matrixValue('jei_version')}"
            modCompileOnly "mezz.jei:jei-${minecraftVersion}-neoforge-api:${matrixValue('jei_version')}"
            modLocalRuntime "mezz.jei:jei-${minecraftVersion}-neoforge:${matrixValue('jei_version')}"
        } else {
            compileOnly "mezz.jei:jei-${minecraftVersion}-common-api:${matrixValue('jei_version')}"
            compileOnly "mezz.jei:jei-${minecraftVersion}-neoforge-api:${matrixValue('jei_version')}"
            runtimeOnly "mezz.jei:jei-${minecraftVersion}-neoforge:${matrixValue('jei_version')}"
        }
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
    if (legacy) {
        toolchain { languageVersion = JavaLanguageVersion.of(javaVersion) }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = javaVersion
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', minecraftVersion
    inputs.property 'java_version', javaVersion
    inputs.property 'architectury_api_version', matrixValue('architectury_api_version')
    if (isFabric) {
        inputs.property 'fabric_loader_version', matrixValue('fabric_loader_version')
        filesMatching('fabric.mod.json') {
            expand version: project.version,
                    minecraft_version: minecraftVersion,
                    java_version: javaVersion,
                    fabric_loader_version: matrixValue('fabric_loader_version'),
                    architectury_api_version: matrixValue('architectury_api_version')
        }
    } else {
        inputs.property 'neoforge_version', matrixValue('neoforge_version')
        filesMatching('META-INF/neoforge.mods.toml') {
            expand version: project.version,
                    minecraft_version: minecraftVersion,
                    neoforge_version: matrixValue('neoforge_version'),
                    architectury_api_version: matrixValue('architectury_api_version')
            if (minecraftVersion == '26.2') {
                filter { line -> line.replace('logoFile =', 'iconFile =') }
            }
        }
    }
}

tasks.named('jar') {
    destinationDirectory = legacy
            ? layout.buildDirectory.dir('matrix-intermediates')
            : rootProject.layout.buildDirectory.dir("libs/${project.name}")
}

if (legacy) {
    tasks.named('remapJar') {
        destinationDirectory = rootProject.layout.buildDirectory.dir("libs/${project.name}")
    }
    tasks.register('verifyLegacyRuntime') {
        group = 'verification'
        doLast {
            def runTasks = tasks.withType(JavaExec).findAll {
                it.name.equalsIgnoreCase('runClient') || it.name.equalsIgnoreCase('runServer')
            }
            if (runTasks.empty) throw new GradleException("No game run tasks found for ${project.path}")
            runTasks.each { runTask ->
                def launcher = runTask.javaLauncher.orNull
                if (launcher == null || launcher.metadata.languageVersion.asInt() != javaVersion) {
                    throw new GradleException("${runTask.path} is not configured for Java ${javaVersion}")
                }
            }
        }
    }
}
