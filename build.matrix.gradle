import java.util.Properties

plugins {
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
    id 'dev.architectury.loom' version '1.7.414' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT' apply false
}

def matrixFile = rootProject.file("gradle/matrix/${project.name}.properties")
if (!matrixFile.isFile()) {
    throw new GradleException("Missing matrix properties for ${project.path}: ${matrixFile}")
}

def matrix = new Properties()
matrixFile.withInputStream { matrix.load(it) }
def matrixValue = { String key ->
    def value = matrix.getProperty(key)
    if (value == null) throw new GradleException("Missing '${key}' in ${matrixFile}")
    value
}

def loader = matrixValue('loader')
def minecraftVersion = matrixValue('minecraft_version')
def javaVersion = matrix.getProperty('java_version', '25') as int
def legacy = matrix.getProperty('loom_generation', 'current') == 'legacy'
def isFabric = loader == 'fabric'
def isNeoForge = loader == 'neoforge'
if (!isFabric && !isNeoForge) throw new GradleException("Unsupported loader '${loader}'")

group = rootProject.maven_group
version = rootProject.mod_version

def externalBuildRoot = System.getenv('SPELUNKERY_BUILD_ROOT')
if (externalBuildRoot) {
    layout.buildDirectory.set(file("${externalBuildRoot}/${project.name}"))
}

apply plugin: legacy ? 'dev.architectury.loom' : 'dev.architectury.loom-no-remap'
if (!legacy) apply plugin: 'architectury-plugin'

base {
    archivesName = "${rootProject.archives_name}-${loader}-${minecraftVersion}"
}

repositories {
    maven { url 'https://maven.blamejared.com/' }
    maven { url 'https://maven.neoforged.net/releases/' }
}

if (!legacy) {
    architectury {
        minecraft = minecraftVersion
        platformSetupLoomIde()
        if (isFabric) fabric() else neoForge()
    }
}

if (legacy) {
    loom { silentMojangMappingsLicense() }
}

if (isNeoForge) {
    loom { neoForge { } }
    configurations {
        common {
            canBeResolved = true
            canBeConsumed = false
        }
        compileClasspath.extendsFrom common
        runtimeClasspath.extendsFrom common
        developmentNeoForge.extendsFrom common
    }
}

loom {
    if (!legacy) {
        accessWidenerPath = rootProject.file('common/src/main/resources/spelunkery.accesswidener')
    }
    runs {
        configureEach {
            runDir = rootProject.file("runs/${project.name}/${name}")
        }
    }
}

sourceSets {
    main {
        if (minecraftVersion == '26.2') {
            java.setSrcDirs([
                    layout.buildDirectory.dir('matrix-sources/common').get().asFile,
                    layout.buildDirectory.dir("matrix-sources/${loader}").get().asFile
            ])
        } else if (isNeoForge && (minecraftVersion == '26.1' || minecraftVersion == '26.1.1')) {
            java.setSrcDirs([
                    rootProject.file('common/src/main/java'),
                    layout.buildDirectory.dir('matrix-sources/neoforge').get().asFile
            ])
        } else {
            java.setSrcDirs([
                    rootProject.file('common/src/main/java'),
                    rootProject.file("${loader}/src/main/java")
            ])
        }
        resources.setSrcDirs([
                rootProject.file('common/src/main/resources'),
                rootProject.file("${loader}/src/main/resources")
        ])
    }
}

if (isNeoForge && (minecraftVersion == '26.1' || minecraftVersion == '26.1.1')) {
    tasks.register('prepareEarlyNeoForgeSources', Sync) {
        from rootProject.file('neoforge/src/main/java')
        into layout.buildDirectory.dir('matrix-sources/neoforge')
        filteringCharset = 'UTF-8'
        filter { line ->
            line.replace(
                    'import net.neoforged.neoforge.event.level.block.BreakBlockEvent;',
                    'import net.neoforged.neoforge.event.level.BlockEvent;'
            ).replace('BreakBlockEvent event', 'BlockEvent.BreakEvent event')
        }
    }
    tasks.named('compileJava') {
        dependsOn tasks.named('prepareEarlyNeoForgeSources')
    }
}

if (minecraftVersion == '26.2') {
    def replacements26_2 = [
            'net.minecraft.world.level.block.state.properties.DripstoneThickness': 'net.minecraft.world.level.block.state.properties.SpeleothemThickness',
            'DripstoneThickness': 'SpeleothemThickness',
            'net.minecraft.advancements.CriteriaTriggers': 'net.minecraft.advancements.triggers.CriteriaTriggers',
            'foundry.getBlockPos().getCenter()': 'net.minecraft.world.phys.Vec3.atCenterOf(foundry.getBlockPos())',
            'livingAttacker.knockback(BASH_STRENGTH, xKnockback, zKnockback);': 'livingAttacker.knockback(BASH_STRENGTH, xKnockback, zKnockback, blocker.damageSources().mobAttack(blocker), 0.0F);'
    ]
    ['common', loader].each { sourceName ->
        tasks.register("prepare${sourceName.capitalize()}26_2Sources", Sync) {
            from rootProject.file("${sourceName}/src/main/java")
            into layout.buildDirectory.dir("matrix-sources/${sourceName}")
            filteringCharset = 'UTF-8'
            inputs.property('compatibilityReplacements', replacements26_2)
            filter { line ->
                replacements26_2.inject(line) { adjusted, from, to -> adjusted.replace(from, to) }
            }
            doLast {
                if (sourceName == 'common') {
                    def pointed = new File(destinationDir, 'net/vg/spelunkery/block/SpelunkeryPointedDripstoneBlock.java')
                    pointed.setText(pointed.getText('UTF-8').replace(
                            'super(properties);',
                            'super(net.minecraft.world.level.block.Blocks.DRIPSTONE_BLOCK.defaultBlockState(), properties);'
                    ), 'UTF-8')
                }
            }
        }
    }
    tasks.named('compileJava') {
        dependsOn tasks.named('prepareCommon26_2Sources')
        dependsOn tasks.named("prepare${loader.capitalize()}26_2Sources")
    }
}

dependencies {
    minecraft "net.minecraft:minecraft:${minecraftVersion}"
    if (legacy) mappings loom.officialMojangMappings()

    if (isFabric) {
        def fabricDependency = legacy ? { notation -> modImplementation notation } : { notation -> implementation notation }
        fabricDependency("net.fabricmc:fabric-loader:${matrixValue('fabric_loader_version')}")
        fabricDependency("net.fabricmc.fabric-api:fabric-api:${matrixValue('fabric_api_version')}")
        fabricDependency("dev.architectury:architectury-fabric:${matrixValue('architectury_api_version')}")
        if (legacy) {
            modCompileOnly "mezz.jei:jei-${minecraftVersion}-common-api:${matrixValue('jei_version')}"
            modCompileOnly "mezz.jei:jei-${minecraftVersion}-fabric-api:${matrixValue('jei_version')}"
            modLocalRuntime "mezz.jei:jei-${minecraftVersion}-fabric:${matrixValue('jei_version')}"
        } else {
            compileOnly "mezz.jei:jei-${minecraftVersion}-common-api:${matrixValue('jei_version')}"
            compileOnly "mezz.jei:jei-${minecraftVersion}-fabric-api:${matrixValue('jei_version')}"
            runtimeOnly "mezz.jei:jei-${minecraftVersion}-fabric:${matrixValue('jei_version')}"
        }
    } else {
        neoForge "net.neoforged:neoforge:${matrixValue('neoforge_version')}"
        implementation "dev.architectury:architectury-neoforge:${matrixValue('architectury_api_version')}"
        if (legacy) {
            modCompileOnly "mezz.jei:jei-${minecraftVersion}-common-api:${matrixValue('jei_version')}"
            modCompileOnly "mezz.jei:jei-${minecraftVersion}-neoforge-api:${matrixValue('jei_version')}"
            modLocalRuntime "mezz.jei:jei-${minecraftVersion}-neoforge:${matrixValue('jei_version')}"
        } else {
            compileOnly "mezz.jei:jei-${minecraftVersion}-common-api:${matrixValue('jei_version')}"
            compileOnly "mezz.jei:jei-${minecraftVersion}-neoforge-api:${matrixValue('jei_version')}"
            runtimeOnly "mezz.jei:jei-${minecraftVersion}-neoforge:${matrixValue('jei_version')}"
        }
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
    if (legacy) {
        toolchain { languageVersion = JavaLanguageVersion.of(javaVersion) }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = javaVersion
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', minecraftVersion
    inputs.property 'java_version', javaVersion
    inputs.property 'architectury_api_version', matrixValue('architectury_api_version')
    if (isFabric) {
        inputs.property 'fabric_loader_version', matrixValue('fabric_loader_version')
        filesMatching('fabric.mod.json') {
            expand version: project.version,
                    minecraft_version: minecraftVersion,
                    java_version: javaVersion,
                    fabric_loader_version: matrixValue('fabric_loader_version'),
                    architectury_api_version: matrixValue('architectury_api_version')
        }
    } else {
        inputs.property 'neoforge_version', matrixValue('neoforge_version')
        filesMatching('META-INF/neoforge.mods.toml') {
            expand version: project.version,
                    minecraft_version: minecraftVersion,
                    neoforge_version: matrixValue('neoforge_version'),
                    architectury_api_version: matrixValue('architectury_api_version')
        }
    }
}

tasks.named('jar') {
    destinationDirectory = rootProject.layout.buildDirectory.dir("libs/${project.name}")
}

if (legacy) {
    tasks.named('remapJar') {
        destinationDirectory = rootProject.layout.buildDirectory.dir("libs/${project.name}")
    }
    tasks.register('verifyLegacyRuntime') {
        group = 'verification'
        doLast {
            def runTasks = tasks.withType(JavaExec).findAll {
                it.name.equalsIgnoreCase('runClient') || it.name.equalsIgnoreCase('runServer')
            }
            if (runTasks.empty) throw new GradleException("No game run tasks found for ${project.path}")
            runTasks.each { runTask ->
                def launcher = runTask.javaLauncher.orNull
                if (launcher == null || launcher.metadata.languageVersion.asInt() != javaVersion) {
                    throw new GradleException("${runTask.path} is not configured for Java ${javaVersion}")
                }
            }
        }
    }
}
